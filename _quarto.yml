project:
  type: website
  title: "sjvvickers.org"
  output-dir: docs

execute:
  freeze: true


website:
  search: false
  back-to-top-navigation: true
  title: "Sam J. Vizcaino Vickers"
  favicon: assets/academic.png
  image: assets/theta_nabla_shape_badge_dark_v4.png
  site-url: https://www.sjvvickers.github.io
  repo-url: "https://github.com/sam-vizcaino-vickers/sjvvickers.github.io"
  repo-branch: "main"
  repo-actions: 'none'
  navbar:
    type: dark 
    background: "#181a1a"
    pinned: true
    right:
      - href: index.qmd
        text: "Home"
#      - href: laboratory/index.qmd
#        text: "Laboratory Site"
      - href: projects/index.qmd
        text: "Projects"
#      - href: training/index.qmd
#        text: "Training courses"
#       - href: book/index.qmd
#         text: "Chapters"
      - href: case_studies/index.qmd
        text: "Case Studies"
      - href: publications/index.qmd
        text: "Publications"
#      - href: presentations/index.qmd
#        text: "Presentations"
      - href: notes/index.qmd
        text: "Notes"
      - href: about/index.qmd
        text: "About"
  page-footer:
    left: |
      © Sam J. Vizcaino Vickers 2025-{{< meta build_year >}}. [{{< var licence.short >}}]({{< var licence.url >}}). Made with Claude & Quarto 

format:
  html:
    copy-code: true
    page-layout: full
    theme: [darkly, assets/main.scss]
    css: 
      - assets/main.css
    toc: true
    include-in-header: includes/header.html
    filters:
      - utils/footer-date.lua
extensions:
  iconify:
    size: "2em"







